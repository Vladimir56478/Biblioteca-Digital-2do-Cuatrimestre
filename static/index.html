<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lorekeeper - Biblioteca</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="device">
    <div class="app">
      <header class="logo">
        <!-- Logo de Lorekeeper reemplazado por el PNG disponible en el proyecto -->
        <img src="/static/logo.png" alt="Lorekeeper" />
      </header>

      <main>
        <!-- Pantalla inicial donde el usuario entra con su correo y contraseña para acceder a la biblioteca. -->
        <section id="view-account" style="display:block">
          <div class="section-title">Mi Cuenta</div>
          
          <!-- Login Form -->
          <form id="loginForm" class="auth-form" data-form="login">
            <input name="Gmail" placeholder="Gmail técnico" required />
            <input name="Contraseña" placeholder="Contraseña" type="password" required />
            <button type="submit">Iniciar sesión</button>
          </form>
          <div id="loginMsg" class="msg"></div>

          <!-- Mensaje de bienvenida -->
          <div id="welcome" style="display:none; margin-top:12px; padding:12px; background:#e8f5e9; border-radius:8px; color:#2e7d32;"></div>
        </section>

        <!-- Vista principal del catálogo, donde se puede buscar y explorar los libros disponibles. -->
        <section class="search" id="view-home" style="display:none">
          <div class="section-title">¡Hola!</div>
          <div class="search">
            <input id="searchInput" placeholder="Buscar título del libro" />
            <button id="searchBtn">🔍</button>
          </div>

          <div class="section-title">Catálogo</div>
          <section id="results" class="cards"></section>
          <div id="resultsPagination" class="pagination"></div>
        </section>

        <!-- Formulario para registrar nuevos libros cuando el bibliotecario desea dar de alta un título. -->
        <section id="view-admin" style="display:none">
          <div class="section-title">Alta Libro</div>
          <form id="bookForm">
            <input name="Titulo" placeholder="Titulo" required />
            <input name="Editorial" placeholder="Editorial" />
            <select name="ID_Autor" id="authorSelect"><option value="">Seleccione autor</option></select>
            <input name="Año_Publicacion" placeholder="Año de publicación" type="number" />
            <input name="ISBN" placeholder="ISBN" />
            <textarea name="Sinopsis" placeholder="Sinopsis"></textarea>
            <input name="Stock" placeholder="Stock" type="number" value="1" />
            <button type="submit">Agregar libro</button>
          </form>
          <div id="bookMsg" class="msg"></div>
        </section>

        <!-- Vista de administración para localizar libros existentes y modificar su información o stock. -->
        <section id="view-edit" style="display:none">
          <div class="section-title">Edición</div>
          <div class="search">
            <input id="editSearchInput" placeholder="Buscar libro para editar" />
            <button id="editSearchBtn">Buscar</button>
          </div>

          <!-- Subpestañas: Lista / Editar libro -->
          <div class="edit-tabs" style="margin-top:10px; display:flex; gap:8px;">
            <button type="button" class="edit-tab-btn" data-tab="list">Lista de libros</button>
            <button type="button" class="edit-tab-btn" data-tab="detail">Editar libro</button>
          </div>

          <section id="editListTab" class="cards edit-subtab" style="margin-top:8px;"></section>
          <div id="editPagination" class="pagination"></div>

          <section id="editDetailTab" class="edit-subtab" style="display:none; margin-top:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; flex-wrap:wrap;">
              <div style="font-weight:700">Editar libro</div>
              <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button type="button" id="deleteBookBtn" style="background:#c62828; color:white; border:none; padding:8px 12px; border-radius:6px; cursor:pointer;">Eliminar libro</button>
                <button type="button" id="backToEditList">Volver a la lista</button>
              </div>
            </div>
            <form id="editForm" style="display:block">
              <input type="hidden" name="ID_Libro" id="editBookId" />
              <input name="Titulo" id="editTitulo" placeholder="Titulo" required />
              <input name="Editorial" id="editEditorial" placeholder="Editorial" />
              <select name="ID_Autor" id="editAuthorSelect"><option value="">Seleccione autor</option></select>
              <input name="Año_Publicacion" id="editAño_Publicacion" placeholder="Año de publicación" type="number" />
              <input name="ISBN" id="editISBN" placeholder="ISBN" />
              <textarea name="Sinopsis" id="editSinopsis" placeholder="Sinopsis"></textarea>
              <input name="Stock" id="editStock" placeholder="Stock" type="number" min="0" />
              <select name="Motivo" id="editMotivo" style="display:none">
                <option value="">Seleccione motivo técnico</option>
                <option value="Dañado">Dañado</option>
                <option value="Extraviado">Extraviado</option>
                <option value="Retirado">Retirado</option>
              </select>
              <button type="submit">Guardar cambios</button>
            </form>
          </section>
          <div id="editMsg" class="msg"></div>
        </section>

        <!-- Sección destinada a revisar el historial de reservas y bajas de stock realizadas en el sistema. -->
        <section id="view-history" style="display:none">
          <div class="section-title">Historial</div>
          <div class="history-controls" style="margin-top:12px;">
            <div class="history-tabs" style="display:flex; gap:8px; margin-bottom:8px;">
              <button type="button" class="history-tab-btn active" data-tab="reservas">Reservas</button>
              <button type="button" class="history-tab-btn" data-tab="bajas">Bajas de stock</button>
            </div>
            <div class="history-actions" style="display:flex; gap:8px;">
              <button type="button" id="clearReservasBtn" style="flex:1; background:#c62828; color:white; border:none; padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">Eliminar historial reservas</button>
              <button type="button" id="clearBajasBtn" style="flex:1; background:#c62828; color:white; border:none; padding:8px 10px; border-radius:6px; cursor:pointer; font-size:12px; font-weight:600;">Eliminar historial bajas</button>
            </div>
          </div>
          <div id="historyContainers" style="margin-top:12px;">
            <div id="history-reservas" style="overflow-x:auto;"></div>
            <div id="history-bajas" style="display:none; overflow-x:auto;"></div>
          </div>
          <div id="historyReservasPagination" class="pagination"></div>
          <div id="historyBajasPagination" class="pagination"></div>
          <div id="historyMsg" class="msg"></div>
        </section>

        <!-- Panel de control para ver perfiles de usuarios y cambiar su estado de acceso cuando corresponde. -->
        <section id="view-profiles" style="display:none">
          <div class="section-title">Gestión de Perfiles</div>
          <div id="profilesMsg" class="msg"></div>
          <div id="profilesContainer" style="overflow-x:auto; margin-top:12px;"></div>
          <div id="profilesPagination" class="pagination"></div>
        </section>

        <!-- Formulario de reserva que se activa cuando el usuario selecciona un libro desde el catálogo. -->
        <section id="view-reserve" style="display:none">
          <div class="section-title">Reservar</div>
          <form id="reserveForm">
            <input type="hidden" id="reserveBookId" name="ID_Libro" />
            <div style="position: relative; margin-bottom: 10px;">
              <input id="reserveTitulo" name="Titulo" placeholder="Título del libro" required style="padding-right: 35px;" />
              <button type="button" id="clearTituloBtn" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 16px; color: #999;">✕</button>
            </div>
            <input id="reserveCantidad" name="Cantidad" placeholder="Cantidad" type="number" value="1" min="1" />
            <button type="submit">Reservar libro</button>
          </form>
          <div id="reserveMsg" class="msg"></div>
        </section>
      </main>

      <!-- Navegación inferior para moverse entre las distintas pantallas sin salir de la aplicación. -->
      <nav class="bottom-nav">
        <a href="#" class="nav-item" data-view="account"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="#333" stroke-width="1.6"/><path d="M6 20c1.5-3 7-3 12 0" stroke="#333" stroke-width="1.6"/></svg><span>Cuenta</span></a>
        <a href="#" class="nav-item" data-view="home" data-protected="true" data-role="user"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Inicio</span></a>
        <a href="#" class="nav-item" data-view="reserve" data-protected="true" data-role="user"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="#333" stroke-width="1.6"/></svg><span>Reservas</span></a>
        <a href="#" class="nav-item" data-view="admin" data-protected="true" data-role="Bibliotecario"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#333" stroke-width="1.6" stroke-linecap="round"/></svg><span>Alta Libro</span></a>
        <a href="#" class="nav-item" data-view="edit" data-protected="true" data-role="Bibliotecario"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h16" stroke="#333" stroke-width="1.6"/><path d="M7 11l5 5 5-5" stroke="#333" stroke-width="1.6" stroke-linecap="round"/></svg><span>Edición</span></a>
        <a href="#" class="nav-item" data-view="history" data-protected="true" data-role="Bibliotecario"><svg viewBox="0 0 24 24" fill="none"><path d="M4 5h16M4 10h16M4 15h16" stroke="#333" stroke-width="1.6" stroke-linecap="round"/></svg><span>Historial</span></a>
        <a href="#" class="nav-item" data-view="profiles" data-protected="true" data-role="Bibliotecario"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="#333" stroke-width="1.6"/><path d="M6 20c1.5-3 7-3 12 0" stroke="#333" stroke-width="1.6"/></svg><span>Perfiles</span></a>
      </nav>
    </div>
  </div>
  <script src="/static/app.js?v=3"></script>
</body>
</html>
