<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lorekeeper - Biblioteca</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="device">
    <div class="app">
      <header class="logo">
        <img src="/static/logo.svg" alt="Lorekeeper" />
      </header>

      <main>
        <!-- PESTAÑA CUENTA: Login/Signup -->
        <section id="view-account" style="display:block">
          <div class="section-title">Mi Cuenta</div>
          
          <!-- Tabs para Login/Signup -->
          <div class="auth-tabs">
            <button class="auth-tab active" data-tab="login">Iniciar sesión</button>
            <button class="auth-tab" data-tab="signup">Crear cuenta</button>
          </div>

          <!-- Login Form -->
          <form id="loginForm" class="auth-form" data-form="login">
            <input name="Gmail" placeholder="Gmail técnico" required />
            <input name="Contraseña" placeholder="Contraseña" type="password" required />
            <button type="submit">Iniciar sesión</button>
          </form>
          <div id="loginMsg" class="msg"></div>

          <!-- Signup Form -->
          <form id="signupForm" class="auth-form" data-form="signup" style="display:none">
            <input name="Nombre_Completo" placeholder="Nombre y Apellido" required />
            <input name="Gmail" placeholder="Gmail técnico" required />
            <input name="Contraseña" placeholder="Contraseña" type="password" required />
            <button type="submit">Crear cuenta</button>
          </form>
          <div id="signupMsg" class="msg"></div>

          <!-- Welcome message -->
          <div id="welcome" style="display:none; margin-top:12px; padding:12px; background:#e8f5e9; border-radius:8px; color:#2e7d32;"></div>
        </section>

        <section class="search" id="view-home" style="display:none">
          <div class="section-title">¡Hola!</div>
          <div class="search">
            <input id="searchInput" placeholder="Buscar título del libro" />
            <button id="searchBtn">🔍</button>
          </div>

          <div class="section-title">Catálogo</div>
          <section id="results" class="cards"></section>
        </section>

        <section id="view-admin" style="display:none">
          <div class="section-title">Alta Libro</div>
          <form id="bookForm">
            <input name="Titulo" placeholder="Titulo" required />
            <input name="Editorial" placeholder="Editorial" />
            <select name="ID_Autor" id="authorSelect"><option value="">Seleccione autor</option></select>
            <input name="Año_Publicacion" placeholder="Año de publicación" type="number" />
            <input name="ISBN" placeholder="ISBN" />
            <textarea name="Sinopsis" placeholder="Sinopsis"></textarea>
            <input name="Stock" placeholder="Stock" type="number" value="1" />
            <button type="submit">Agregar libro</button>
          </form>
          <div id="bookMsg" class="msg"></div>
        </section>

        <section id="view-reserve" style="display:none">
          <div class="section-title">Reservar</div>
          <form id="reserveForm">
            <input name="ID_Libro" placeholder="ID del libro" type="number" required />
            <input name="Cantidad" placeholder="Cantidad" type="number" value="1" min="1" />
            <button type="submit">Reservar libro</button>
          </form>
          <div id="reserveMsg" class="msg"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-item" data-view="account"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3" stroke="#333" stroke-width="1.6"/><path d="M6 20c1.5-3 7-3 12 0" stroke="#333" stroke-width="1.6"/></svg><span>Cuenta</span></a>
        <a href="#" class="nav-item" data-view="home" data-protected="true"><svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5L12 4l9 7.5" stroke="#333" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Inicio</span></a>
        <a href="#" class="nav-item" data-view="reserve" data-protected="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="#333" stroke-width="1.6"/></svg><span>Reservas</span></a>
        <a href="#" class="nav-item" data-view="admin" data-protected="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#333" stroke-width="1.6" stroke-linecap="round"/></svg><span>Alta Libro</span></a>
      </nav>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
